name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap base dev jar
        run: |
          cp settings.gradle settings.gradle.bak
          grep -v "include('addons:power-ruble-orgcontracts')" settings.gradle.bak > settings.gradle
          ./gradlew build
          mv settings.gradle.bak settings.gradle

      - name: Build
        run: ./gradlew build
