name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap base dev jar
        run: |
          cp settings.gradle settings.gradle.bak
          grep -v "include('addons:power-ruble-orgcontracts')" settings.gradle.bak > settings.gradle
          ./gradlew build
          mv settings.gradle.bak settings.gradle

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/libs/power-ruble-${GITHUB_REF_NAME#v}.jar" \
            "build/libs/power-ruble-${GITHUB_REF_NAME#v}-sources.jar" \
            "build/devlibs/power-ruble-${GITHUB_REF_NAME#v}-dev.jar" \
            "addons/power-ruble-orgcontracts/build/libs/power-ruble-orgcontracts-${GITHUB_REF_NAME#v}.jar" \
            "addons/power-ruble-orgcontracts/build/libs/power-ruble-orgcontracts-${GITHUB_REF_NAME#v}-sources.jar" \
            --title "Power Ruble ${GITHUB_REF_NAME}" \
            --notes "Power Ruble release ${GITHUB_REF_NAME}."
